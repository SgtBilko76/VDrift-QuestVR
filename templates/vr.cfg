# VDrift VR settings (this copy lives in /sdcard/VDriftVR/vr.cfg; edit it and
# restart the app)

# Display refresh rate in Hz. Quest 2/3 support 72, 80, 90, 120. 0 = system default.
refresh = 72

# Eye buffer size as a fraction of the runtime's recommended resolution.
# Above 1.0 is sharper; the scene is drawn twice per frame at this size.
supersampling = 1.2

# Multisampling for the eye buffers: 1 = off, 2, 4 or 8. Resolved in tile
# memory, so far cheaper than supersampling.
msaa = 4

# The 2D layer (menus and the in-race HUD): its height in pixels, 4:3 like
# VDrift's menu layouts. Bigger is crisper and costs a little fill rate.
ui_height = 1200

# Floating menu screen: distance and height in metres.
screen_distance = 2.2
screen_height = 1.7

# In-race HUD panel, head-locked: distance, height, and how far below eye level.
hud_distance = 1.4
hud_height = 1.15
hud_drop = 0.05

# Steering response of the left stick. 1.0 is linear; below 1 flattens the
# response around centre and still reaches full lock at the stop. VDrift's own
# speed-sensitive steering (Options -> Controls) applies on top.
steer_sensitivity = 0.6

# Force feedback, played as controller rumble.
ffb_rumble = 1
ffb_rumble_scale = 1.0
ffb_rumble_deadzone = 0.12

# benchmark = 1 starts a race directly (VDrift's -benchmark mode), for testing
# over adb without pointing at menu items.
benchmark = 0
