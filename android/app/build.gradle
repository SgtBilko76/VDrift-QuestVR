plugins {
    id 'com.android.application'
}

// Self-contained build:  tools\make_release.ps1
// Packs the staged game data into the APK as assets/gamedata.zip, which the
// activity unpacks to /sdcard/VDriftVR on first run. Off by default.
def vdvrBundleData = project.hasProperty('vdvrBundleData') && project.property('vdvrBundleData').toString().toBoolean()

// VDrift source tree (branch quest-port); CMakeLists.txt finds it next to this
// repo by default. Override with -PvdriftRoot=/path/to/vdrift.
def vdriftRoot = project.hasProperty('vdriftRoot') ? file(project.property('vdriftRoot')).absolutePath : null

// Release key: android/keystore.properties (storeFile, storePassword, keyAlias,
// keyPassword), not in git. Without it, release builds use the debug key.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.vdriftvr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.vdriftvr'
        minSdk 29
        targetSdk 32
        versionCode 2
        versionName '0.2.0'

        externalNativeBuild {
            cmake {
                // One shared library, so the static STL is fine.
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-29',
                          '-DANDROID_ARM_NEON=ON'
                if (vdriftRoot) {
                    arguments "-DVD_ROOT=${vdriftRoot}"
                }
                targets 'vdriftvr'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            if (vdvrBundleData) {
                assets.srcDirs += "${buildDir}/bundled-assets"
            }
        }
    }

    androidResources {
        noCompress 'zip'
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    // OpenXR loader (headers + libopenxr_loader.so) from the Maven AAR via prefab.
    buildFeatures {
        prefab true
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            jniDebuggable true
        }
        release {
            // The debug key keeps sideloaded upgrades simple, but it differs per
            // machine; a shared release key (keystore.properties) does not.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
